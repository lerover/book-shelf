  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:#785d3b;font-family:'DM Sans',sans-serif;font-size:13px;padding:0}button,input{font:inherit}button,a,input,label{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{width:100%;min-height:100vh;min-height:100dvh;background:#fff;display:grid;grid-template-columns:205px minmax(0,1fr);padding:0;border-radius:0;overflow:hidden}.sidebar{padding:32px 23px 20px;display:flex;flex-direction:column;border-right:1px dashed #e9e5df;position:relative}.sidebar:after{content:'';position:absolute;right:5px;top:0;bottom:0;width:1px;background:#f4f2ee}.brand{text-align:center;color:#61320c;margin:0 0 48px;font-family:'Lora',serif;font-size:25px;font-weight:700;letter-spacing:-1px}.owl{display:block;width:47px;height:30px;margin:0 auto -1px;color:#b88843}.nav{display:grid;gap:9px}.nav a{display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:12px;color:#a08c74;font-size:13px}.nav a.active{color:#67431b;background:#f1ede5;box-shadow:inset 0 0 0 1px #d7cbb9,0 2px 3px #8c715518}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.continue{margin: auto 10px 0;background:linear-gradient(130deg,#e5e5e5,#f7f7f7);border:1px solid #b8b8b8;border-radius:13px 13px 0 0;padding:13px 17px 16px;text-align:center;color:#4b4b4b;box-shadow:0 2px 5px #00000010}.continue p{font-size:10px;margin:0 0 10px}.continue img{width:78px;height:112px;object-fit:cover;box-shadow:3px 4px 5px #0002}.progress{height:4px;background:#e4ded3;margin-top:12px}.progress span{display:block;width:60%;height:100%;background:#baa17b}.profile{display:flex;align-items:center;gap:8px;background:#f1f1f1;border-radius:10px;padding:8px;color:#414141;margin:0 -2px;font-size:12px}.avatar{width:29px;height:32px;border-radius:5px;object-fit:cover;filter:grayscale(1)}.profile span:last-child{margin-left:auto;font-size:21px}.library{margin-left:0;padding:32px clamp(24px,4vw,72px) 40px;border-radius:0;background:radial-gradient(ellipse at 45% 20%,#fffaf6,#fcf5ef 80%);min-width:0}.toolbar{display:flex;align-items:center;gap:6px;padding:5px;background:#fffdf9;border-radius:9px;box-shadow:0 4px 12px #8b70551a;margin-bottom:36px}.view-input{position:absolute;opacity:0;pointer-events:none}.toolbar label{padding:8px 12px;font-size:11px;white-space:nowrap;cursor:pointer;border-radius:5px;color:#a49076}#shelves:checked~.toolbar label[for=shelves],#all:checked~.toolbar label[for=all]{background:#f1e9dc;color:#6b421b;box-shadow:0 2px 4px #8b705510}.search{flex:1;min-width:0;background:#f0f0f0;border-radius:5px;display:flex;gap:7px;align-items:center;padding:5px 9px;color:#929292}.search input{border:0;outline:none;background:none;min-width:0;width:100%;font-size:12px;color:#676767}.search:focus-within{outline:2px solid #bba17e}.search .icon{width:18px;height:18px}.shelf-section{margin-bottom:36px}.shelf-section:last-child{margin-bottom:18px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 10px 23px}.section-heading h1,.section-heading h2{font-size:16px;font-weight:400;margin:0;letter-spacing:-.3px}.full-shelf{font-size:10px;color:#6d6459}.full-shelf span{font-size:17px;margin-left:4px}.books{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;padding:0 22px;min-height:111px}.books.current{justify-content:flex-start;gap:51px}.book{position:relative;display:block;width:78px;height:110px;flex:0 0 78px;transition:transform .2s;outline-offset:6px;background:#d7d1bd;box-shadow:4px 3px 5px #40301c2b,-2px 0 3px #40301c10}.book:hover,.book:focus-visible{transform:translateY(-7px) rotate(-2deg)}.book img{display:block;width:100%;height:100%;object-fit:cover}.book:after{content:'';position:absolute;inset:0;box-shadow:inset 3px 0 3px #ffffff40,inset -1px 0 2px #0002;pointer-events:none}.shelf{position:relative;height:15px;margin-top:1px;background:linear-gradient(#f7efdb 0%,#eee3cb 40%,#e2d5bb 75%,#d9ccb2 100%);border-radius:3px;box-shadow:0 17px 21px 8px #68563c25,0 2px 3px #5e492522}.shelf:before{content:'';position:absolute;top:1px;left:5px;right:5px;height:2px;background:#fff9e9aa}.reading-line{position:absolute;bottom:-12px;left:0;width:100%;height:4px;background:#e3d7bf;z-index:2}.reading-line:after{content:'';display:block;width:64%;height:100%;background:#b29b76}#all:checked~.collection .books{justify-content:flex-start;flex-wrap:wrap;gap:30px}#all:checked~.collection .shelf{opacity:.45}a:focus-visible,label:has(+input:focus-visible){outline:2px solid #ad8956}#shelves:focus-visible~.toolbar label[for=shelves],#all:focus-visible~.toolbar label[for=all]{outline:2px solid #ad8956}
    @media(min-width:1400px){.app{grid-template-columns:240px minmax(0,1fr)}.library{padding-top:40px}.toolbar{margin-bottom:54px}.shelf-section{margin-bottom:54px}.books{min-height:170px}.book{height:170px;width:118px;flex-basis:118px}.books.current{gap:65px}.section-heading h1,.section-heading h2{font-size:19px}.section-heading{margin-bottom:30px}}

    @media(max-width:410px){body{padding:0}.app{padding:0}.library{padding:16px 12px 23px}.nav{gap:2px}.nav a{padding:9px 10px;font-size:11px}.nav .icon{width:15px}.toolbar{flex-wrap:wrap;gap:3px}.search{flex-basis:100%;margin-top:3px;padding:7px 9px}.books,.books.current{gap:25px;padding:0 9px}.book{width:65px;height:94px;flex-basis:65px}.full-shelf{font-size:9px}}
    @media(prefers-reduced-motion:reduce){.book{transition:none}}
